name: JLPT Database Checks
on:
  push:
    paths:
      - 'database/**'
      - 'data-src/n*.csv'
      - 'scripts/build_jlpt_db.py'
      - 'scripts/build_jlpt_content.py'
      - 'scripts/audit_jlpt_coverage.py'
      - 'scripts/sync_jlpt_drafts.py'
      - 'scripts/test_jlpt_variants.py'
      - 'scripts/test_jlpt_quality.py'
      - 'scripts/export_jlpt_vocab.py'
      - 'scripts/build_n5_pages.py'
      - 'scripts/jlpt_word_urls.py'
      - 'scripts/test_n5_pages.py'
      - 'scripts/test_review_store.js'
      - 'public/js/review-store.js'
      - 'public/js/learning-home.js'
      - 'public/jlpt/review/**'
      - 'scripts/import_jlpt_questions.py'
      - 'public/jlpt/vocabulary/**'
      - 'scripts/test_jlpt_db.py'
      - 'scripts/test_jlpt_content.py'
      - 'public/jlpt/practice/**'
      - '.github/workflows/jlpt-database.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'data-src/n*.csv'
      - 'scripts/build_jlpt_db.py'
      - 'scripts/build_jlpt_content.py'
      - 'scripts/audit_jlpt_coverage.py'
      - 'scripts/sync_jlpt_drafts.py'
      - 'scripts/test_jlpt_variants.py'
      - 'scripts/test_jlpt_quality.py'
      - 'scripts/export_jlpt_vocab.py'
      - 'scripts/build_n5_pages.py'
      - 'scripts/jlpt_word_urls.py'
      - 'scripts/test_n5_pages.py'
      - 'scripts/test_review_store.js'
      - 'public/js/review-store.js'
      - 'public/js/learning-home.js'
      - 'public/jlpt/review/**'
      - 'scripts/import_jlpt_questions.py'
      - 'scripts/test_jlpt_db.py'
      - 'scripts/test_jlpt_content.py'
      - 'public/jlpt/vocabulary/**'
      - 'public/jlpt/practice/**'
      - '.github/workflows/jlpt-database.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test JLPT database
        run: |
          python3 scripts/test_jlpt_db.py
          python3 scripts/test_jlpt_content.py
          python3 scripts/audit_jlpt_coverage.py --strict --output /tmp/jlpt-coverage.json
          python3 scripts/sync_jlpt_drafts.py --check
          python3 scripts/test_jlpt_variants.py
          python3 scripts/test_jlpt_quality.py
          python3 scripts/test_n5_pages.py
          node scripts/test_review_store.js
          python3 scripts/build_jlpt_content.py --db /tmp/shicijp-jlpt-ci.sqlite --output /tmp/shicijp-jlpt-export
      - name: Publish JLPT coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-coverage-report
          path: /tmp/jlpt-coverage.json
          if-no-files-found: warn
      - name: Publish JLPT export samples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-vocabulary-json
          path: /tmp/shicijp-jlpt-export/n*.json
          if-no-files-found: error
