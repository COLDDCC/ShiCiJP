<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLPT N5–N1 日语语法学习 | 中文解析与例句 | 拾词</title><meta name="description" content="免费学习 JLPT N5、N4、N3、N2、N1 日语语法，包含中文解释、日语例句和翻译。"><link rel="canonical" href="https://shicijp.com/jlpt/grammar/"><link rel="stylesheet" href="../../css/style.css"><style>main{max-width:1050px;margin:32px auto 80px;padding:0 18px}h1{font-size:clamp(2rem,5vw,3rem)}.levels{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.levels button{font:inherit;padding:10px 22px;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:9px;cursor:pointer}.levels button[aria-pressed=true]{background:var(--accent);color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:12px;padding:22px}.card h2{margin:0 0 8px;font-size:1.5rem}.card p{color:var(--soft)}.example{border-top:1px solid var(--line);padding-top:12px;font-size:1.2rem}.translation{font-size:.95rem}small{color:var(--soft)}</style></head><body><header class="site-header row"><h1 class="logo"><a href="../../"><span class="seal"></span>拾词</a></h1><nav class="nav"><a href="../">JLPT 学习中心</a><a href="../../">文本工具</a></nav></header><main><p><a href="../">JLPT 学习中心</a> / 语法</p><h1>JLPT N5–N1 日语语法</h1><p>从基础助词到高级书面表达。按等级查看语法要点、中文说明及原创例句。</p><div class="levels" id="levels"></div><p id="count" aria-live="polite"></p><div class="cards" id="cards"></div><p><small>这里是首批精选语法示例，并非完整的官方 JLPT 语法清单。日本语能力测试不发布官方固定语法表。</small></p></main><script>const data={"N5":[["です","礼貌判断句","学生です。","是学生。"],["ます","动词礼貌形","毎日勉強します。","每天学习。"],["は","提示话题","私は学生です。","我是学生。"],["が","标记主语","猫がいます。","有一只猫。"],["を","标记动作对象","水を飲みます。","喝水。"],["に","表示时间或目的地","七時に起きます。","七点起床。"],["で","动作发生的场所","図書館で勉強します。","在图书馆学习。"],["てください","礼貌请求","ここに名前を書いてください。","请在这里写名字。"]],"N4":[["たことがある","表示曾经有过的经历","日本に行ったことがあります。","曾经去过日本。"],["ながら","同时进行两个动作","音楽を聞きながら歩きます。","边听音乐边走路。"],["そうです（样态）","根据外观推测","雨が降りそうです。","看起来快下雨了。"],["なければならない","表示必须","宿題をしなければなりません。","必须做作业。"],["てしまう","表示完成或遗憾","財布を忘れてしまいました。","不小心忘带钱包了。"],["ようになる","表示状态变化","日本語が話せるようになりました。","变得会说日语了。"]],"N3":[["ようにする","有意识地养成习惯","毎日新聞を読むようにしています。","我尽量每天读报纸。"],["わけではない","表示并非完全如此","嫌いなわけではありません。","并不是讨厌。"],["ことになっている","表示规定或安排","ここでは靴を脱ぐことになっています。","这里规定要脱鞋。"],["たびに","每当发生某事","会うたびに元気になります。","每次见面都精神起来。"],["おかげで","由于有利原因而得到好结果","先生のおかげで合格できました。","多亏老师才通过考试。"],["ばかり","表示总是、净是","甘いものばかり食べています。","总是吃甜食。"]],"N2":[["にもかかわらず","表示尽管如此","雨にもかかわらず試合は続いた。","尽管下雨，比赛仍继续。"],["にすぎない","表示只不过","これは一つの例にすぎない。","这只不过是一个例子。"],["わけにはいかない","表示受情理限制不能做","約束したので休むわけにはいかない。","已经约好了，不能休息。"],["ざるを得ない","表示不得不","計画を変更せざるを得ない。","不得不改变计划。"],["に応じて","根据情况相应调整","年齢に応じて方法を変える。","根据年龄改变方法。"],["ものの","表示转折，虽然……但是","買ったものの、使っていない。","虽然买了，却没有使用。"]],"N1":[["を余儀なくされる","表示被迫采取行动","悪天候で中止を余儀なくされた。","因天气恶劣被迫取消。"],["いかんによっては","表示取决于某事的情况","結果いかんによっては再検討する。","视结果可能重新讨论。"],["に至るまで","表示范围延伸到极端","細部に至るまで確認した。","连细节都确认了。"],["までもない","表示没有必要","言うまでもないことです。","这是不言而喻的事。"],["とあって","表示由于特殊情况","休日とあって駅は混雑していた。","因为是假日，车站很拥挤。"],["ずにはおかない","表示必然引起某种反应","その話は人々を感動させずにはおかない。","那个故事必然让人感动。"]]};const levels=document.getElementById("levels"),cards=document.getElementById("cards");function show(level){levels.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===level)));cards.replaceChildren();document.getElementById("count").textContent=level+" · "+data[level].length+" 个精选语法点";for(const [name,description,japanese,chinese] of data[level]){const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=name;const p=document.createElement("p");p.textContent=description;const e=document.createElement("div");e.className="example";e.lang="ja";e.textContent=japanese;const t=document.createElement("p");t.className="translation";t.textContent=chinese;card.append(h,p,e,t);cards.append(card)}history.replaceState(null,"","#"+level.toLowerCase())}for(const level of ["N5","N4","N3","N2","N1"]){const b=document.createElement("button");b.textContent=level;b.type="button";b.addEventListener("click",()=>show(level));levels.append(b)}show((location.hash.slice(1).toUpperCase() in data)?location.hash.slice(1).toUpperCase():"N5");</script></body></html>
