<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLPT N5–N1 日语阅读理解练习与中文解析 | 拾词</title><meta name="description" content="免费 JLPT N5、N4、N3、N2、N1 分级日语阅读理解练习，原创短文、选择题、中文翻译和答案解析。"><link rel="canonical" href="https://shicijp.com/jlpt/reading/"><link rel="stylesheet" href="../../css/style.css"><style>body{margin:0}main{max-width:1000px;margin:30px auto 90px;padding:0 20px}h1{font-size:clamp(2rem,5vw,3rem)}.levels{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.levels button,.actions button,.answers button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--fg);padding:10px 16px}.levels button[aria-pressed=true],.actions button:first-child{background:var(--accent);color:white}.panels{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.panel{border:1px solid var(--line);border-radius:14px;padding:25px}.article{font-size:1.3rem;line-height:2.2;white-space:pre-line}.minor{color:var(--soft)}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left}.answers button.correct{background:rgba(44,145,89,.15);border-color:#38905b}.answers button.wrong{background:rgba(196,80,70,.12);border-color:#c65046}.actions{display:flex;gap:10px;flex-wrap:wrap}.translation{border-top:1px solid var(--line);padding-top:15px}.translation[hidden]{display:none}@media(max-width:750px){.panels{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><header class="site-header row"><h1 class="logo"><a href="../../"><span class="seal"></span>拾词</a></h1><nav class="nav"><a href="../">JLPT 学习中心</a><a href="../../">文本工具</a></nav></header><main><p><a href="../">JLPT 学习中心</a> / 阅读理解</p><h1>N5–N1 日语分级阅读</h1><p class="minor">每级一篇原创入门练习：读文章、回答问题、查看中文翻译与解析。后续将持续扩充题库。</p><div class="levels" id="levels"></div><div class="panels"><article class="panel"><small id="label"></small><h2 id="title"></h2><div class="article" lang="ja" id="article"></div><div class="actions"><button id="speak" type="button">▶ 朗读文章</button><button id="translate" type="button" aria-expanded="false">查看中文翻译</button></div><p class="translation" id="translation" hidden></p></article><section class="panel"><h2>阅读理解测验</h2><p lang="ja" id="question"></p><div class="answers" id="answers"></div><p id="feedback" role="status" aria-live="polite"></p><p class="minor" id="progress"></p></section></div><p class="minor">本站练习是原创教学材料，不是 JLPT 官方真题，也不代表官方题目难度。</p></main><script>const data={"N5":{"title":"図書館で勉強する日","text":"今日は土曜日です。朝九時に起きました。十時に友達と図書館へ行きました。図書館で日本語の本を読みました。昼ご飯は近くの店で食べました。午後三時に家へ帰りました。","zh":"今天是星期六。早上九点起床。十点和朋友去了图书馆。在图书馆读了日语书。午饭在附近的店里吃。下午三点回家。","q":"図書館へ何時に行きましたか。","opts":["九時","十時","三時","七時"],"a":1,"why":"原文写道「十時に友達と図書館へ行きました」。"},"N4":{"title":"新しいアルバイト","text":"先月から駅の近くの喫茶店でアルバイトを始めました。最初は注文を聞くのが難しくて、何度も店長に質問しました。でも、毎日少しずつ仕事を覚えました。今はお客さんと話すことも楽しくなりました。来月からは朝の時間にも働く予定です。","zh":"从上个月开始，我在车站附近的咖啡店打工。起初点单很难，我多次问店长。但每天一点点记住了工作内容。现在和客人说话也变得有趣。计划下个月开始早班工作。","q":"最初、何が難しかったですか。","opts":["店まで歩くこと","注文を聞くこと","朝早く起きること","料理を作ること"],"a":1,"why":"原文明确说「最初は注文を聞くのが難しくて」。"},"N3":{"title":"地域のお祭り","text":"私が住んでいる町では、毎年秋になると小さなお祭りが開かれます。今年は雨が降りそうだったので、開催するかどうか朝まで決まりませんでした。しかし、昼ごろには空が明るくなり、予定どおり始まりました。私は会場でボランティアとして道案内をしました。観光客に説明するたびに、町の歴史をもっと知りたいと思うようになりました。","zh":"我居住的城镇每年秋天都会举办小型节庆。今年因为看起来要下雨，直到早上还没决定是否举行。但中午左右天色转亮，活动如期开始。我在会场当志愿者指路。每次向游客说明，都更想了解这座城镇的历史。","q":"筆者は祭りで何をしましたか。","opts":["料理を売った","歌を歌った","道案内をした","写真を展示した"],"a":2,"why":"「ボランティアとして道案内をしました」说明作者负责指路。"},"N2":{"title":"在宅勤務と働き方","text":"在宅勤務が広がったことで、通勤時間を減らせるようになった人は多い。一方、仕事と私生活の境界が曖昧になったという声もある。働く場所を自由に選べることは便利であるものの、誰にとっても最適な方法とは限らない。企業には、社員の状況に応じて柔軟な制度を整える姿勢が求められている。","zh":"随着居家办公普及，许多人减少了通勤时间。另一方面，也有人认为工作与私人生活的界限变得模糊。自由选择工作地点虽便利，却未必适合所有人。企业需要根据员工情况建立灵活制度。","q":"筆者の考えに最も近いものはどれですか。","opts":["全員が在宅勤務をするべきだ","通勤時間は増やすべきだ","個人に合わせた制度が必要だ","在宅勤務は必ず失敗する"],"a":2,"why":"末句强调「社員の状況に応じて柔軟な制度」。"},"N1":{"title":"文化財の保存と公開","text":"歴史的建造物の保存において、一般公開は必ずしも無条件に望ましいわけではない。訪問者が増えれば地域経済への波及効果が期待できる一方、建物そのものへの負担も避けられない。保存状態いかんによっては、公開範囲の縮小を余儀なくされる場合もある。重要なのは、短期的な集客数だけを成果と見なさず、次世代への継承を視野に入れた判断を積み重ねることだ。","zh":"在历史建筑保护中，对公众开放并不总是无条件值得提倡。游客增加可望带动当地经济，但也不可避免增加建筑负担。视保存状况，可能不得不缩小开放范围。重要的是不要只看短期客流，而应从传承给下一代的角度持续作出判断。","q":"筆者が最も重視していることは何ですか。","opts":["短期的な集客数","入場料の引き上げ","長期的な保存と継承","公開の全面中止"],"a":2,"why":"最后一句强调「次世代への継承を視野に入れた判断」。"}};const $=id=>document.getElementById(id);let active="N5",answered=false;const get=()=>{try{return JSON.parse(localStorage.getItem("shici.jlpt.reading")||"{}")}catch{return {}}};function render(l){active=l;answered=false;const d=data[l];document.querySelectorAll("[data-level]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===l)));$("label").textContent=l+" · 阅读练习 01";$("title").textContent=d.title;$("article").textContent=d.text;$("translation").textContent=d.zh;$("translation").hidden=true;$("translate").textContent="查看中文翻译";$("translate").setAttribute("aria-expanded","false");$("question").textContent=d.q;$("feedback").textContent="";$("answers").replaceChildren();d.opts.forEach((v,i)=>{const b=document.createElement("button");b.type="button";b.textContent=(i+1)+". "+v;b.addEventListener("click",()=>{if(answered)return;answered=true;b.classList.add(i===d.a?"correct":"wrong");if(i!==d.a)$("answers").children[d.a].classList.add("correct");$("feedback").textContent=(i===d.a?"回答正确。":"回答错误。")+" "+d.why;const p=get();p[l]={correct:i===d.a,at:Date.now()};try{localStorage.setItem("shici.jlpt.reading",JSON.stringify(p))}catch{}updateProgress()});$("answers").append(b)});updateProgress();history.replaceState(null,"","#"+l.toLowerCase())}function updateProgress(){const p=get();$("progress").textContent="已完成 "+Object.keys(p).length+" / 5 篇入门练习"}for(const l of ["N5","N4","N3","N2","N1"]){const b=document.createElement("button");b.type="button";b.dataset.level=l;b.textContent=l;b.addEventListener("click",()=>render(l));$("levels").append(b)}$("translate").addEventListener("click",()=>{const hidden=$("translation").hidden;$("translation").hidden=!hidden;$("translate").textContent=hidden?"隐藏中文翻译":"查看中文翻译";$("translate").setAttribute("aria-expanded",String(hidden))});$("speak").addEventListener("click",()=>{if(!("speechSynthesis"in window)){alert("当前浏览器不支持朗读");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(data[active].text);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)});render(data[location.hash.slice(1).toUpperCase()]?location.hash.slice(1).toUpperCase():"N5");</script></body></html>
